<script>
// Motion for rig-mode demos and pages: the same two clocks and the same one frame loop as the Hairline
// kernel (hairline/kernel.js, whose index lists the API), so an SVG rig moves exactly like a Hairline figure.
// Plain ESM with no imports: inline it into a demo page (strip `export`) or import it from a React scene.
//
//   const s = spring(rest)            continuous input (where the pointer is): write s.t, step with stepS
//   const t = tween(rest)             a discrete choice (which item): tset(t, to, now, delay), read tval
//   const loop = register(el, tick)   tick(dt, now) returns true while anything still moves; loop.wake() after input
//
// Numbers (do not invent others without a reason you can state):
//   spring k 100 · c 18 · m 1           follows a moving target without ever "chasing" a timed ease
//   tween 700ms on cubic-bezier(.32, .72, 0, 1)   the lift curve: a long, soft landing for choices
//   stagger |i − a| × 30–60ms           spreads from the pointer instead of running down a list
// Reduced motion: springs and tweens land at once, and the loop takes one frame per wake.

const reducedMotion = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

/** A spring at rest on x. Retarget by writing .t. */
function spring(x, { k = 100, c = 18, m = 1, eps = 0.01 } = {}) {
  return { x, v: 0, t: x, k, c, m, eps };
}
/** Advance by dt seconds (sub-stepped for stability); returns whether it is still moving. */
function stepS(s, dt) {
  if (reducedMotion()) { s.x = s.t; s.v = 0; return false; }
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let i = 0; i < n; i++) { const a = (s.k * (s.t - s.x) - s.c * s.v) / s.m; s.v += a * h; s.x += s.v * h; }
  if (Math.abs(s.t - s.x) < s.eps && Math.abs(s.v) < s.eps) { s.x = s.t; s.v = 0; return false; }
  return true;
}

/** A CSS cubic-bezier as a function of progress (Newton on x, then y). */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t, dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (p) => {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    let t = p;
    for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - p) / d; }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
const EASE_LIFT = bezier(0.32, 0.72, 0, 1);

/** A tween at rest on v. */
const tween = (v, dur = 700) => ({ from: v, to: v, start: 0, dur });
/** The value at now. */
function tval(tw, now) {
  if (reducedMotion() || now >= tw.start + tw.dur) return tw.to;
  if (now <= tw.start) return tw.from;
  return tw.from + (tw.to - tw.from) * EASE_LIFT((now - tw.start) / tw.dur);
}
/** Retarget from wherever it is, starting after `delay` ms (the stagger). The same target again does nothing. */
function tset(tw, to, now, delay = 0) {
  if (to === tw.to) return;
  tw.from = tval(tw, now);
  tw.to = to;
  tw.start = now + delay;
}
const tdone = (tw, now) => reducedMotion() || now >= tw.start + tw.dur;

/**
 * Join one shared frame loop. tick(dt seconds, now ms) returns true to ask for another frame. The loop stops when
 * every tick has settled and sleeps while `el` is off-screen (IntersectionObserver); wake() restarts it after input.
 */
const members = new Set();
let raf = 0, last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 1 / 60);
  last = now;
  let more = false;
  for (const m of members) if (m.visible && m.awake) { m.awake = m.tick(dt, now) === true; more ||= m.awake; }
  raf = more ? requestAnimationFrame(frame) : 0;
}
function register(el, tick) {
  const m = { tick, awake: true, visible: true };
  members.add(m);
  const wake = () => { m.awake = true; if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  const io = typeof IntersectionObserver === "function"
    ? new IntersectionObserver(([e]) => { m.visible = e.isIntersecting; if (m.visible) wake(); })
    : null;
  io?.observe(el);
  wake();
  return { wake, unregister: () => { members.delete(m); io?.disconnect(); } };
}

const svg = document.querySelector("svg.ill");
const parts = [...svg.querySelectorAll(":scope > g[data-part]")];
const glyphs = [...svg.querySelectorAll(".glyph")];
const charms = [...svg.querySelectorAll(".charm")];
const OX = 100, OY = 190, P = (x, y, z) => [OX + x - y, OY + (x + y) / 2 - z];
const GUARD = P(0, 0, 104), TIP = P(0, 0, 4); // the blade's REST span on screen: the hit test never moves
const LIFT = 10, REST = 0;

const charge = spring(REST, { eps: 0.002 });
const swing = charms.map(() => spring(0, { eps: 0.05 }));
let lit = -1, lastUser = performance.now();

function draw() {
  const lift = charge.x * LIFT;
  for (const g of parts) g.style.transform = "translateY(" + (-lift).toFixed(2) + "px)";
  charms.forEach((c, i) => (c.style.transform = "rotate(" + swing[i].x.toFixed(2) + "deg)"));
  // discrete: how many glyphs are lit (each change eases in over 700ms in CSS, on the lift curve)
  const n = Math.min(3, Math.floor(charge.t * 3.999 + 0.0001));
  if (n !== lit) { lit = n; glyphs.forEach((g, i) => { g.style.transitionDelay = Math.abs(i - (n - 1)) * 45 + "ms"; g.classList.toggle("lit", i < n); }); } // stagger by distance, no timers
}
const loop = register(svg, (dt) => {
  let moving = stepS(charge, dt);
  swing.forEach((s, i) => { s.t = Math.max(-18, Math.min(18, -charge.v * (i ? 26 : -26))); if (stepS(s, dt)) moving = true; });
  draw();
  return moving;
});

const toBox = (e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
function aim(p) {
  if (!p || Math.abs(p.x - GUARD[0]) > 46) charge.t = REST;
  else charge.t = Math.max(0, Math.min(1, (p.y - GUARD[1]) / (TIP[1] - GUARD[1])));
  loop.wake();
}
svg.addEventListener("pointermove", (e) => { lastUser = performance.now(); aim(toBox(e)); });
svg.addEventListener("pointerleave", () => aim(null));

// idle ghost: one slow charge down the blade and back, only after 5s untouched
setInterval(() => {
  if (reducedMotion() || location.hash || performance.now() - lastUser < 5000) return;
  charge.t = 1; loop.wake();
  setTimeout(() => { if (performance.now() - lastUser >= 5000) { charge.t = REST; loop.wake(); } }, 1800);
  lastUser = performance.now() - 1000;
}, 1000);

const h = new URLSearchParams(location.hash.slice(1));
if (h.has("charge")) { glyphs.forEach((g) => (g.style.transition = "none")); charge.x = charge.t = +h.get("charge"); swing.forEach((sp, i) => (sp.x = i ? -10 : 10)); draw(); }
</script></body></html>
