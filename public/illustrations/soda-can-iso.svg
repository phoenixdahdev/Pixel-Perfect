<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     class="ill" data-ill="iso-can" role="img" aria-label="Isometric drinks can">
  <style>
    .ill { --ill-paper:#08090a; --ill-edge:#d0d6e0; --ill-dim:#3e3e44; --ill-ink:#62666d; --ill-accent:#e41e2b;
           background:var(--ill-paper); }
    .ill * { vector-effect: non-scaling-stroke; }
    .ill [data-part] { transform-box: fill-box; }
    .ill .s, .ill .sd { fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ill .s  { stroke: var(--ill-edge); }
    .ill .sd { stroke: var(--ill-dim); }
    .ill .o { fill: var(--ill-paper); }
    .ill .f { fill: var(--ill-accent); }
  </style>

  <g id="base" data-part="base" style="transform-origin: 50% 100%">
    <path class="o" d="M60 173.5 A46 23 0 1 1 140 173.5 L133 179.5 A38 19 0 0 1 67 179.5 Z" />
    <path class="s" d="M60 173.5 L67 179.5 A38 19 0 0 0 133 179.5 L140 173.5" pathLength="1" />
  </g>

  <g id="body" data-part="body" style="transform-origin: 50% 100%">
    <path class="f" d="M54 74 A46 23 0 0 1 146 74 L146 162 A46 23 0 0 1 54 162 Z" />
    <path class="s" d="M54 74 L54 162 A46 23 0 0 0 146 162 L146 74" pathLength="1" />
  </g>

  <g id="shoulder" data-part="shoulder" style="transform-origin: 50% 100%">
    <path class="o" d="M63.5 54.5 A38 19 0 0 1 136.5 54.5 L144 67.5 A46 23 0 1 1 56 67.5 Z" />
    <path class="s" d="M63.5 54.5 L56 67.5 A46 23 0 1 0 144 67.5 L136.5 54.5" pathLength="1" />
  </g>

  <g id="lid" data-part="lid" style="transform-origin: 50% 100%">
    <path class="o" d="M62 57 A38 19 0 0 1 138 57 L138 60 A38 19 0 0 1 62 60 Z" />
    <path class="s" d="M62 57 L62 60 A38 19 0 0 0 138 60 L138 57" pathLength="1" />
    <ellipse class="s o" cx="100" cy="57" rx="38" ry="19" pathLength="1" />
    <ellipse class="sd" cx="100" cy="57" rx="34" ry="17" pathLength="1" />
    <g id="lid-panel" data-part="lid-panel" data-decal="" transform="matrix(1 0.5 -1 0.5 100 59)" style="transform-origin: 50% 50%">
      <path class="sd" d="M-6 5 H6 Q9 5 8 8.5 L2.5 16.5 Q0 19.5 -2.5 16.5 L-8 8.5 Q-9 5 -6 5 Z" pathLength="1" />
      <g id="tab" data-part="tab" style="transform-box: view-box; transform-origin: 0 0">
        <rect class="s o" x="-7" y="-20" width="14" height="24" rx="5" pathLength="1" />
        <rect class="s" x="-4" y="-16" width="8" height="7" rx="3" pathLength="1" />
        <circle class="s o" cx="0" cy="0" r="2.5" pathLength="1" />
      </g>
    </g>
  </g>
</svg>
